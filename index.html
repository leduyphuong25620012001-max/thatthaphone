<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thật Thà Phone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --ink:#12172B; --ink-soft:#4B5268; --bg:#F5F6FA; --card:#FFFFFF;
  --line:#E4E6F0; --accent:#2F6FED; --accent-soft:#EAF0FF;
  --amber:#F2A93B; --amber-soft:#FEF3DF; --red:#E0524F; --red-soft:#FDEAEA;
  --green:#1FA971; --green-soft:#E8F8F1; --radius:14px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);}
h1,h2,h3,.brand{font-family:'Space Grotesk',sans-serif;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
::-webkit-scrollbar{width:8px;height:8px;} ::-webkit-scrollbar-thumb{background:#D3D6E5;border-radius:8px;}

#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#12172B,#1D2440 60%,#2F6FED);}
.login-box{background:var(--card);padding:36px 32px;border-radius:20px;width:340px;box-shadow:0 20px 60px rgba(0,0,0,.35);}
.login-box .brand{font-size:22px;font-weight:700;margin-bottom:4px;}
.login-box .tag{color:var(--ink-soft);font-size:13px;margin-bottom:24px;}
.login-box input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;margin-bottom:12px;font-size:14px;}
.login-box button{width:100%;padding:12px;border:none;border-radius:10px;background:var(--accent);color:#fff;font-weight:600;font-size:14px;}
.err{color:var(--red);font-size:13px;margin-bottom:10px;}

#appScreen{display:none;min-height:100vh;}
.shell{display:flex;min-height:100vh;}
.sidebar{width:220px;background:var(--ink);color:#fff;flex-shrink:0;display:flex;flex-direction:column;padding:20px 0;}
.sidebar .brand{padding:0 20px 20px;font-size:18px;font-weight:700;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:10px;}
.sidebar .brand small{display:block;font-family:'Inter';font-weight:400;color:#9AA3C4;font-size:11px;margin-top:2px;}
.navitem{padding:11px 20px;font-size:14px;color:#C6CAE0;display:flex;align-items:center;gap:10px;border-left:3px solid transparent;}
.navitem.active{background:rgba(255,255,255,.06);color:#fff;border-left-color:var(--accent);}
.navitem:hover{color:#fff;cursor:pointer;}
.sidebar .who{margin-top:auto;padding:16px 20px 0;border-top:1px solid rgba(255,255,255,.1);font-size:12px;color:#9AA3C4;}
.sidebar .who-row{display:flex;align-items:center;gap:8px;}
.sidebar .avatar{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;}
.sidebar .who-info{overflow:hidden;}
.sidebar .who-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px;color:#fff;font-weight:600;}
.sidebar .who-role{font-size:11px;color:#9AA3C4;}
.sidebar .who button{margin-top:10px;background:none;border:1px solid rgba(255,255,255,.2);color:#fff;padding:6px 10px;border-radius:8px;font-size:12px;width:100%;}
.main{flex:1;padding:22px 28px;max-width:100%;overflow-x:auto;transition:opacity 0.08s ease-out;}
.pagehead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
.pagehead h1{font-size:20px;margin:0;}
.btn{border:none;border-radius:10px;padding:10px 16px;font-weight:600;font-size:13px;background:var(--accent);color:#fff;}
.btn.secondary{background:var(--card);color:var(--ink);border:1px solid var(--line);}
.btn.danger{background:var(--red-soft);color:var(--red);}
.btn.small{padding:6px 10px;font-size:12px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;}
.grid{display:grid;gap:14px;}
.grid.cols-4{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));}
.grid.cols-3{grid-template-columns:repeat(3,1fr);}
.grid.cols-2{grid-template-columns:repeat(2,1fr);}
.mobile-topbar{display:none;}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;}
.stat .lbl{font-size:12px;color:var(--ink-soft);margin-bottom:6px;}
.stat .val{font-size:22px;font-weight:700;}
.stat.clickable{cursor:pointer;transition:transform .12s,box-shadow .12s;}
.stat.clickable:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(20,25,60,.10);}
.stat.hero{background:linear-gradient(135deg,#2F6FED,#1B3FA8);border:none;color:#fff;padding:22px 24px;}
.stat.hero .lbl{color:#CBDBFF;font-size:13px;}
.stat.hero .val{font-size:34px;font-weight:700;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;color:var(--ink-soft);font-weight:600;padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap;}
td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle;}
tr:hover td{background:#FAFBFF;}
input.f, select.f, textarea.f{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:#fff;}
label.fl{font-size:12px;color:var(--ink-soft);font-weight:600;margin-bottom:4px;display:block;}
.field{margin-bottom:12px;}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(10,12,25,.5);align-items:center;justify-content:center;z-index:50;padding:20px;}
.modal-x{position:absolute;top:14px;right:14px;background:#F0F1F6;border:none;width:32px;height:32px;border-radius:50%;font-size:15px;color:var(--ink-soft);cursor:pointer;z-index:5;}
.modal-x:hover{background:#E4E6F0;}
.modal{background:#fff;border-radius:16px;padding:24px;max-width:600px;width:100%;max-height:88vh;overflow:auto;}
.modal h2{margin-top:0;font-size:17px;}
.tag{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;}
.tag.instock{background:var(--green-soft);color:var(--green);}
.tag.sold{background:#EEF0F6;color:var(--ink-soft);}
.tag.warn{background:var(--amber-soft);color:#A9711A;}
.tag.repair{background:var(--accent-soft);color:var(--accent);}
.tag.cancelled{background:var(--red-soft);color:var(--red);}
.prod-card{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;cursor:pointer;}
.prod-card img{width:100%;aspect-ratio:1/1;object-fit:cover;background:#EEF0F6;display:block;}
.prod-card .noimg{width:100%;aspect-ratio:1/1;background:#EEF0F6;display:flex;align-items:center;justify-content:center;color:#B5B9CE;font-size:12px;text-align:center;padding:10px;}
.prod-card .pc-body{padding:10px 12px;}
.prod-card .pc-name{font-weight:600;font-size:13px;margin-bottom:4px;}
.prod-card .pc-meta{font-size:12px;color:var(--ink-soft);}
.prod-card .pc-price{font-size:12px;color:var(--accent);font-weight:700;margin-top:4px;}
.prod-card .pc-cost{font-size:11px;color:var(--red);font-weight:600;margin-top:2px;}
.searchbar{display:flex;gap:10px;margin-bottom:16px;}
.searchbar input{flex:1;}
.imgrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
.imgrow>div{position:relative;}
.imgrow img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block;}
.rm-img{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;border:none;border-radius:50%;width:18px;height:18px;font-size:12px;line-height:16px;text-align:center;padding:0;}
.unit-row{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;position:relative;}
.unit-row .rm{position:absolute;top:8px;right:8px;background:none;border:none;color:var(--red);font-size:16px;}
.tabbar{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
.tabbar button{padding:8px 14px;border-radius:9px;border:1px solid var(--line);background:#fff;font-size:12px;font-weight:600;color:var(--ink-soft);}
.tabbar button.active{background:var(--ink);color:#fff;border-color:var(--ink);}
.empty{color:var(--ink-soft);font-size:13px;padding:30px;text-align:center;}
.hint{color:var(--ink-soft);font-size:12px;margin-top:4px;}
.qstats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;}
.qs-item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-width:140px;flex:1;}
.qs-item.green{background:var(--green-soft);border-color:var(--green);}
.qs-item.green .qs-val{color:var(--green);}
.qs-item.red{background:var(--red-soft);border-color:var(--red);}
.qs-item.red .qs-val{color:var(--red);}
.qs-lbl{font-size:11px;color:var(--ink-soft);margin-bottom:3px;}
.qs-val{font-size:16px;font-weight:700;}
.qs-item{cursor:pointer;transition:transform .12s,box-shadow .12s;}
.qs-item:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(20,25,60,.08);}
.invoice-wrap{border:1px dashed var(--line);border-radius:12px;padding:18px;}
@media(max-width:900px){.grid.cols-4{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));}.grid.cols-3{grid-template-columns:repeat(2,1fr);}.sidebar{width:64px;}.sidebar .navitem span.label{display:none;}.sidebar .brand{display:none;}}
@media(max-width:640px){
  body{padding-bottom:0;}
  .mobile-topbar{display:flex;align-items:center;justify-content:space-between;background:var(--ink);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:30;}
  .mobile-topbar .mt-brand{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;}
  .mobile-topbar .mt-right{display:flex;align-items:center;gap:10px;}
  .mobile-topbar .avatar{width:26px;height:26px;font-size:12px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;}
  .mobile-topbar .mt-logout{background:rgba(255,255,255,.12);border:none;color:#fff;width:30px;height:30px;border-radius:50%;font-size:14px;}
  .shell{flex-direction:column;}
  .sidebar{display:flex;flex-direction:row;width:100%!important;position:fixed;bottom:0;left:0;right:0;z-index:35;padding:0;justify-content:flex-start;align-items:stretch;height:72px;box-shadow:0 -3px 14px rgba(10,12,25,.18);overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
  .sidebar::-webkit-scrollbar{display:none;}
  .sidebar .brand, .sidebar .who{display:none;}
  #navList{display:flex;width:max-content;min-width:100%;}
  .navitem{flex:0 0 auto;min-width:78px;flex-direction:column;justify-content:center;align-items:center;padding:8px 10px;border-left:none!important;border-top:3px solid transparent;font-size:12.5px;gap:4px;text-align:center;white-space:nowrap;}
  .navitem.active{border-top-color:var(--accent);background:rgba(255,255,255,.06);}
  .navitem .nav-icon{font-size:23px;line-height:1;}
  .navitem span.label{display:block!important;font-size:12.5px;line-height:1.1;font-weight:600;}
  .main{padding:12px 12px 86px;}
  .grid.cols-2{grid-template-columns:1fr;}
  .grid.cols-3{grid-template-columns:repeat(2,1fr);}
  .grid.cols-4{grid-template-columns:repeat(auto-fill,minmax(105px,1fr));}
  .modal{padding:16px;border-radius:14px;max-height:88vh;}
  .modal-bg{align-items:flex-end;padding:0;}
  .modal{border-radius:18px 18px 0 0;max-width:100%;}
  .searchbar{flex-direction:column;}
  .searchbar select{max-width:100%!important;}
  .pagehead{margin-bottom:14px;}
  .pagehead h1{font-size:16px;}
  .qstats{flex-wrap:nowrap;overflow-x:auto;gap:8px;margin-bottom:14px;-webkit-overflow-scrolling:touch;padding-bottom:2px;scrollbar-width:none;}
  .qstats::-webkit-scrollbar{display:none;}
  .qstats::-webkit-scrollbar{display:none;}
  .qs-item{min-width:118px;flex:0 0 auto;padding:9px 12px;}
  .qs-lbl{font-size:10px;}
  .qs-val{font-size:14px;}
  .tabbar button{padding:7px 10px;font-size:11px;}
  table{font-size:12px;}
  th,td{padding:7px 5px;}
  table{display:block;overflow-x:auto;}
}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-box">
    <div class="brand">📱 Thật Thà Phone</div>
    <div class="tag">Đăng nhập hệ thống nội bộ</div>
    <div class="err" id="loginErr"></div>
    <input class="f" id="loginEmail" placeholder="Email" type="email">
    <input class="f" id="loginPass" placeholder="Mật khẩu" type="password">
    <button class="btn" onclick="doLogin()">Đăng nhập</button>
  </div>
</div>

<div id="appScreen">
  <div class="mobile-topbar">
    <div class="mt-brand">📱 Thật Thà Phone</div>
    <div class="mt-right">
      <div class="avatar" id="whoAvatarM">?</div>
      <button class="mt-logout" onclick="doLogout()" title="Đăng xuất">⎋</button>
    </div>
  </div>
  <div class="shell">
    <div class="sidebar">
      <div class="brand">📱 Thật Thà Phone<small>Quản lý nội bộ</small></div>
      <div id="navList"></div>
      <div class="who">
        <div class="who-row">
          <div class="avatar" id="whoAvatar">?</div>
          <div class="who-info">
            <div class="who-name" id="whoName" title=""></div>
            <div class="who-role" id="whoRole"></div>
          </div>
        </div>
        <button onclick="doLogout()">Đăng xuất</button>
      </div>
    </div>
    <div class="main" id="main"></div>
  </div>
</div>

<div class="modal-bg" id="modalBg"><div class="modal" style="position:relative;"><button class="modal-x" onclick="closeModal()">✕</button><div id="modalBody"></div></div></div>

<script>
const SB_URL = "https://tskokvlkntxvfsgwcdje.supabase.co";
const SB_KEY = "sb_publishable_AcaxXwJ5qCjyYHbTmFwolw_kqiztMkH";
const sb = supabase.createClient(SB_URL, SB_KEY);

let ME=null, PROFILE=null, TAB='ban';
let CATEGORIES=[], PRODUCTS=[], UNITS=[], CUSTOMERS=[], SALES=[], SALE_ITEMS=[], DEBTS=[], PAYMENTS=[], COLLECTIONS=[], EXPENSES=[], PROFILES=[], QC_CHECKS=[];

/* ---------- helpers ---------- */
function fmt(n){ n = Math.round(Number(n)||0); return n.toLocaleString('vi-VN'); }
function unfmt(s){ return Number(String(s).replace(/[^\d]/g,''))||0; }
function nowISO(){ return new Date().toISOString(); }
function debounce(fn, ms){ let t; return (...args)=>{ clearTimeout(t); t=setTimeout(()=>fn(...args), ms||180); }; }
function dOnly(iso){ return new Date(iso).toLocaleDateString('vi-VN'); }
function dTime(iso){ return new Date(iso).toLocaleString('vi-VN'); }
function daysSince(iso){ return Math.floor((Date.now()-new Date(iso).getTime())/86400000); }
function openModal(html){ document.getElementById('modalBody').innerHTML = html; document.getElementById('modalBg').style.display='flex'; }
function closeModal(){ document.getElementById('modalBg').style.display='none'; LB_ACTIVE=false; }
async function uploadImage(file){
  try{
    const path = `u_${Date.now()}_${Math.random().toString(36).slice(2)}_${file.name.replace(/[^a-zA-Z0-9.]/g,'_')}`;
    const {error} = await sb.storage.from('app-images').upload(path, file);
    if(error){ alert('Lỗi tải ảnh lên: '+error.message); return null; }
    const {data} = sb.storage.from('app-images').getPublicUrl(path);
    return data.publicUrl;
  }catch(err){ alert('Lỗi tải ảnh: '+err.message); return null; }
}

/* ---------- reusable image pickers ---------- */
let imgPicker = {existing:[], files:[]};
function resetImgPicker(existingUrls){ imgPicker = {existing:[...(existingUrls||[])], files:[]}; renderImgPicker(); }
function renderImgPicker(){
  const el = document.getElementById('imgPickerBox'); if(!el) return;
  let html='';
  imgPicker.existing.forEach((url,idx)=>{ html+=`<div><img src="${url}"><button type="button" class="rm-img" onclick="imgPicker.existing.splice(${idx},1);renderImgPicker()">×</button></div>`; });
  imgPicker.files.forEach((f,idx)=>{ html+=`<div><img src="${URL.createObjectURL(f)}"><button type="button" class="rm-img" onclick="imgPicker.files.splice(${idx},1);renderImgPicker()">×</button></div>`; });
  el.innerHTML = html || '<span class="hint">Chưa có ảnh nào</span>';
}
function addImgPickerFiles(fileList){ imgPicker.files.push(...fileList); renderImgPicker(); }

let qrPicker = {existingUrl:null, file:null};
function resetQrPicker(url){ qrPicker={existingUrl:url||null, file:null}; renderQrPicker(); }
function renderQrPicker(){
  const el = document.getElementById('qrPickerBox'); if(!el) return;
  const src = qrPicker.file ? URL.createObjectURL(qrPicker.file) : qrPicker.existingUrl;
  el.innerHTML = src ? `<img src="${src}" style="max-width:130px;max-height:170px;width:auto;height:auto;object-fit:contain;border-radius:8px;border:1px solid var(--line);background:#fff;">` : '<span class="hint">Chưa có ảnh QR</span>';
}
function setQrFile(file){ if(file){ qrPicker.file=file; renderQrPicker(); } }

/* ---------- auth ---------- */
async function doLogin(){
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPass').value;
  document.getElementById('loginErr').textContent = '';
  const {data, error} = await sb.auth.signInWithPassword({email, password});
  if(error){ document.getElementById('loginErr').textContent = 'Sai email hoặc mật khẩu'; return; }
  await afterLogin(data.user);
}
async function doLogout(){ await sb.auth.signOut(); location.reload(); }
async function afterLogin(user){
  ME = user;
  let {data: profile} = await sb.from('profiles').select('*').eq('id', user.id).single();
  PROFILE = profile;
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('appScreen').style.display='block';
  document.getElementById('whoName').textContent = PROFILE?.full_name || user.email;
  document.getElementById('whoName').title = user.email;
  document.getElementById('whoRole').textContent = PROFILE?.role==='admin'?'Admin':'Nhân viên';
  document.getElementById('whoAvatar').textContent = (PROFILE?.full_name||user.email||'?').trim().charAt(0).toUpperCase();
  document.getElementById('whoAvatarM').textContent = (PROFILE?.full_name||user.email||'?').trim().charAt(0).toUpperCase();
  await loadAll();
  buildNav();
  render();
  setupRealtime();
}

/* ---------- data ---------- */
async function loadAll(){
  const [c,p,u,cu,s,si,de,pay,col,ex,pr,qc] = await Promise.all([
    sb.from('categories').select('*').order('name'),
    sb.from('products').select('*').order('created_at',{ascending:false}),
    sb.from('product_units').select('*'),
    sb.from('customers').select('*').order('name'),
    sb.from('sales').select('*').order('sale_date',{ascending:false}),
    sb.from('sale_items').select('*'),
    sb.from('debts').select('*').order('created_at',{ascending:false}),
    sb.from('debt_payments').select('*'),
    sb.from('collections').select('*').order('created_at',{ascending:false}),
    sb.from('expenses').select('*').order('expense_date',{ascending:false}),
    sb.from('profiles').select('*'),
    sb.from('qc_checks').select('*').order('checked_at',{ascending:false}),
  ]);
  CATEGORIES=c.data||[]; PRODUCTS=p.data||[]; UNITS=u.data||[]; CUSTOMERS=cu.data||[];
  SALES=s.data||[]; SALE_ITEMS=si.data||[]; DEBTS=de.data||[]; PAYMENTS=pay.data||[];
  COLLECTIONS=col.data||[]; EXPENSES=ex.data||[]; PROFILES=pr.data||[]; QC_CHECKS=qc.data||[];
}
const debouncedReload = debounce(async ()=>{ await loadAll(); render(); }, 400);
function setupRealtime(){
  sb.channel('sync-all').on('postgres_changes',{event:'*',schema:'public'}, ()=>{
    debouncedReload();
  }).subscribe();
}

/* ---------- nav ---------- */
const NAV = [
  {id:'kho', label:'Kho hàng', icon:'📦'},
  {id:'ban', label:'Bán hàng', icon:'🧾'},
  {id:'donhang', label:'Đơn hàng', icon:'📋'},
  {id:'khach', label:'Khách hàng', icon:'👤'},
  {id:'no', label:'Công nợ', icon:'💳'},
  {id:'thu', label:'Thu tiền nhanh', icon:'💰'},
  {id:'chi', label:'Chi phí', icon:'📉'},
  {id:'baocao', label:'Báo cáo', icon:'📊'},
  {id:'nhanvien', label:'Nhân viên', icon:'👥', adminOnly:true},
  {id:'testmay', label:'Test máy', icon:'🧪'},
];
function canSee(item){
  if(item.adminOnly) return PROFILE?.role==='admin';
  if(PROFILE?.role==='admin') return true;
  const perms = PROFILE?.permissions||{};
  const map = {kho:'kho',testmay:'kho',ban:'ban_hang',donhang:'ban_hang',khach:'khach_hang',no:'cong_no',thu:'ban_hang',chi:'chi_phi',baocao:'bao_cao'};
  return perms[map[item.id]] !== false;
}
let _switchTabTimer = null;
function buildNav(){
  document.getElementById('navList').innerHTML = NAV.filter(canSee).map(n=>`<div class="navitem ${TAB===n.id?'active':''}" onclick="switchTab('${n.id}')" style="pointer-events:auto;"><span class="nav-icon">${n.icon}</span> <span class="label">${n.label}</span></div>`).join('');
}
function switchTab(id){
  if(_switchTabTimer) return; // debounce: ignore if already switching
  if(TAB===id) return; // same tab, skip
  
  TAB=id;
  buildNav();
  
  // show loading state
  const main = document.getElementById('main');
  if(main) main.style.opacity = '0.6';
  
  // clear any pending timer
  clearTimeout(_switchTabTimer);
  
  // render async (0ms delay to allow UI update)
  _switchTabTimer = setTimeout(()=>{
    render();
    if(main) main.style.opacity = '1';
    _switchTabTimer = null;
  }, 50);
}

function debtRemaining(d){ const paid = PAYMENTS.filter(p=>p.debt_id===d.id).reduce((a,p)=>a+Number(p.amount),0); return Number(d.total_amount) - paid; }
function visibleInStockUnits(){
  return UNITS.filter(u=>{
    if(u.status!=='in_stock' || u.hidden) return false;
    const p = PRODUCTS.find(x=>x.id===u.product_id);
    return p && !p.hidden;
  });
}
function dueSoonDebts(){
  const today = new Date(); today.setHours(0,0,0,0);
  return DEBTS.filter(d=>{
    if(!d.due_date) return false;
    if(debtRemaining(d)<=0) return false;
    return new Date(d.due_date+'T00:00:00') <= today;
  });
}

  const todayShopExtra = todayItems.reduce((a,i)=>a+(i.extra_cost_payer==='shop'?Number(i.extra_cost):0),0);

function setKhoStatus(s){
  khoStatus = s;
  document.querySelectorAll('.kho-status-btn').forEach(b=>b.classList.toggle('active', b.dataset.status===s));
  renderProdGrid();
}
function productMinPrice(pid){
  const units = UNITS.filter(u=>u.product_id===pid && !u.hidden);
  if(!units.length) return 0;
  return Math.min(...units.map(u=>Number(u.retail_price)||0));
}
function buildMinPriceMap(){
  const map = {};
  UNITS.forEach(u=>{
    if(u.hidden) return;
    const p = Number(u.retail_price)||0;
    if(!(u.product_id in map) || p < map[u.product_id]) map[u.product_id] = p;
  });
  return map;
}
function productCostRange(pid){
  const units = UNITS.filter(u=>u.product_id===pid && !u.hidden && u.status==='in_stock');
  if(!units.length) return null;
  const costs = units.map(u=>Number(u.cost_price)||0);
  return {min:Math.min(...costs), max:Math.max(...costs)};
}
let khoCardCache = {};
function renderProdGrid(){
  const grid = document.getElementById('prodGrid');
  if(!grid) return;
  const isAdmin = PROFILE?.role==='admin';
  let list = PRODUCTS.filter(p=>{
    if(p.hidden) return false;
    if(khoCat!=='all' && p.category_id!==khoCat) return false;
    const units = UNITS.filter(u=>u.product_id===p.id && !u.hidden);
    const inStockCount = units.filter(u=>u.status==='in_stock').length;
    const warrantyCount = units.filter(u=>u.status==='warranty').length;
    const soldCount = units.filter(u=>u.status==='sold').length;
    if(khoStatus==='con' && inStockCount===0) return false;
    if(khoStatus==='baohanh' && warrantyCount===0) return false;
    if(khoStatus==='het' && !(soldCount>0 && inStockCount===0 && warrantyCount===0)) return false;
    if(khoSearch){
      const s = khoSearch.toLowerCase();
      const matchName = p.name.toLowerCase().includes(s);
      const matchImei = units.some(u=>u.imei && u.imei.toLowerCase().includes(s));
      if(!matchName && !matchImei) return false;
    }
    return true;
  });
  if(khoSort==='asc' || khoSort==='desc'){
    const priceMap = buildMinPriceMap();
    if(khoSort==='asc') list = list.slice().sort((a,b)=>(priceMap[a.id]||0)-(priceMap[b.id]||0));
    else list = list.slice().sort((a,b)=>(priceMap[b.id]||0)-(priceMap[a.id]||0));
  }
  if(!list.length){ grid.innerHTML = '<div class="empty">Chưa có sản phẩm nào.</div>'; return; }
  const frag = document.createDocumentFragment();
  list.forEach(p=>{
    const units = UNITS.filter(u=>u.product_id===p.id && !u.hidden);
    const inStock = units.filter(u=>u.status==='in_stock');
    const warrantyCount = units.filter(u=>u.status==='warranty').length;
    const stale = inStock.some(u=>daysSince(u.imported_at)>15);
    const cat = CATEGORIES.find(c=>c.id===p.category_id);
    const retail = productMinPrice(p.id);
    const cost = productCostRange(p.id);
    const curSrc = (p.images && p.images[0]) || '';
    let entry = khoCardCache[p.id];
    if(!entry || entry.imgSrc !== curSrc){
      const div = document.createElement('div');
      div.className = 'prod-card';
      div.innerHTML = (curSrc ? `<img src="${curSrc}" onerror="this.parentElement.querySelector('img').replaceWith(Object.assign(document.createElement('div'),{className:'noimg',textContent:'Ảnh lỗi'}))">` : `<div class="noimg">Không có ảnh</div>`)
        + `<div class="pc-body"><div class="pc-name"></div><div class="pc-meta"></div><div class="pc-price"></div><div class="pc-cost"></div></div>`;
      entry = {el: div, imgSrc: curSrc};
      khoCardCache[p.id] = entry;
    }
    entry.el.onclick = ()=>openProductDetail(p.id);
    entry.el.querySelector('.pc-name').innerHTML = `${p.name} ${stale?'<span class="tag warn">Tồn >15 ngày</span>':''} ${warrantyCount?'<span class="tag repair">🔧 '+warrantyCount+' bảo hành</span>':''}`;
    entry.el.querySelector('.pc-meta').textContent = `${cat?cat.name:'—'} · Còn ${inStock.length} máy`;
    entry.el.querySelector('.pc-price').textContent = retail? `Bán lẻ: ${fmt(retail)} đ` : '';
    entry.el.querySelector('.pc-cost').textContent = (isAdmin && cost)? `Giá nhập: ${cost.min===cost.max?fmt(cost.min):(fmt(cost.min)+' - '+fmt(cost.max))} đ` : '';
    frag.appendChild(entry.el);
  });
  grid.innerHTML = '';
  grid.appendChild(frag);
}

function findDuplicateImei(imei, excludeUnitId){
  const norm = (imei||'').trim().toLowerCase();
  if(!norm) return null;
  return UNITS.find(u=>!u.hidden && u.id!==excludeUnitId && (u.imei||'').trim().toLowerCase()===norm);
}
function checkDuplicateImeis(rows, excludeUnitId){
  const dups = [];
  for(const r of rows){
    if(r.imei && findDuplicateImei(r.imei, excludeUnitId)) dups.push(r.imei);
  }
  return dups;
}
async function saveProduct(){
  const name = document.getElementById('npName').value.trim();
  if(!name){ alert('Nhập tên sản phẩm'); return; }
  const draftRows = collectUnitRows('__pending__');
  const dups = checkDuplicateImeis(draftRows);
  if(dups.length){
    if(!confirm('⚠️ IMEI sau đã tồn tại trong kho: '+dups.join(', ')+'.\nVẫn muốn tiếp tục lưu?')) return;
  }
  let catId = document.getElementById('npCat').value;
  if(catId==='__new__'){
    const newName = document.getElementById('npNewCat').value.trim();
    if(!newName){ alert('Nhập tên danh mục mới'); return; }
    const {data,error} = await sb.from('categories').insert({name:newName}).select().single();
    if(error){ alert('Lỗi: '+error.message); return; }
    catId = data.id;
  }
  let imageUrls = [...imgPicker.existing];
  for(const f of imgPicker.files){ const url = await uploadImage(f); if(url) imageUrls.push(url); }

  const {data:prod, error:e1} = await sb.from('products').insert({name, category_id:catId, images:imageUrls}).select().single();
  if(e1){ alert('Lỗi: '+e1.message); return; }

  const rows = collectUnitRows(prod.id);
  if(rows.length){
    const {error:e2} = await sb.from('product_units').insert(rows);
    if(e2){ alert('Lỗi lưu máy: '+e2.message); return; }
  }
  closeModal(); await loadAll(); render();
}

async function fetchImageBlob(url){ const res = await fetch(url, {mode:'cors'}); return await res.blob(); }
function blobToPngBlob(blob){
  return new Promise((resolve,reject)=>{
    const objUrl = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = ()=>{
      const canvas = document.createElement('canvas');
      canvas.width = img.naturalWidth||1; canvas.height = img.naturalHeight||1;
      canvas.getContext('2d').drawImage(img,0,0);
      canvas.toBlob(b=> b?resolve(b):reject(new Error('convert lỗi')), 'image/png');
      URL.revokeObjectURL(objUrl);
    };
    img.onerror = reject;
    img.src = objUrl;
  });
}
async function copyLbImage(){
  try{
    await navigator.clipboard.write([
      new ClipboardItem({'image/png': fetchImageBlob(LB_IMAGES[LB_INDEX]).then(blobToPngBlob)})

}
async function downloadLbImage(){

async function uploadImageQuiet(file, retries){
  retries = retries==null ? 2 : retries;
  for(let attempt=0; attempt<=retries; attempt++){
    try{
      const path = `u_${Date.now()}_${Math.random().toString(36).slice(2)}_${file.name.replace(/[^a-zA-Z0-9.]/g,'_')}`;
      const {error} = await sb.storage.from('app-images').upload(path, file);
      if(!error){
        const {data} = sb.storage.from('app-images').getPublicUrl(path);
        return data.publicUrl;
      }
    }catch(err){}
    if(attempt<retries) await new Promise(r=>setTimeout(r,800));
  }
  return null;
}
async function uploadQcMedia(){
  const items = {};
  const failed = [];
  for(const [key,label] of QC_ITEMS){
    const sel = document.querySelector(`.qc-item[data-key="${key}"]`);
    const noteEl = document.querySelector(`.qc-note[data-key="${key}"]`);
    const status = sel ? sel.value : 'pass';
    const note = noteEl ? noteEl.value.trim() : '';
    const photos = [];
    for(const f of qcMedia[key]){
      const url = await uploadImageQuiet(f);
      if(url) photos.push(url); else failed.push(label+' ('+(f.name||'tệp')+')');
    }
    items[key] = {status, note, photos};
  }
  return {items, failed};
}

    if(error){ alert('Lỗi: '+error.message); return; }
    catId = data.id;
  }
  let imageUrls = [...imgPicker.existing];
  for(const f of imgPicker.files){ const url = await uploadImage(f); if(url) imageUrls.push(url); }
  await sb.from('products').update({name, category_id:catId, images:imageUrls}).eq('id', pid);
  closeModal(); await loadAll(); openProductDetail(pid);
}

let saleCardCache = {};
function renderSaleProdGridPage(q){
  q=(q||'').toLowerCase();
  let prods = PRODUCTS.filter(p=>{
    if(p.hidden) return false;
    if(saleCat!=='all' && p.category_id!==saleCat) return false;
    const units = UNITS.filter(u=>u.product_id===p.id && u.status==='in_stock' && !u.hidden);
    if(!units.length) return false;
    if(!q) return true;
    return p.name.toLowerCase().includes(q) || units.some(u=>(u.imei||'').toLowerCase().includes(q));
  });
  if(saleSort==='asc' || saleSort==='desc'){
    const priceMap = buildMinPriceMap();
    if(saleSort==='asc') prods = prods.slice().sort((a,b)=>(priceMap[a.id]||0)-(priceMap[b.id]||0));
    else prods = prods.slice().sort((a,b)=>(priceMap[b.id]||0)-(priceMap[a.id]||0));
  }
  const el = document.getElementById('saleProdGridPage');
  if(!el) return;
  if(!prods.length){ el.innerHTML = '<div class="empty">Không có sản phẩm nào còn hàng để bán. Vào Kho hàng để thêm sản phẩm.</div>'; return; }
  const frag = document.createDocumentFragment();
  prods.forEach(p=>{
    const units = UNITS.filter(u=>u.product_id===p.id && u.status==='in_stock' && !u.hidden);
    const curSrc = (p.images && p.images[0]) || '';
    let entry = saleCardCache[p.id];
    if(!entry || entry.imgSrc !== curSrc){
      const div = document.createElement('div');
      div.className = 'prod-card';
      div.innerHTML = (curSrc? `<img src="${curSrc}">`:`<div class="noimg">Không có ảnh</div>`) + `<div class="pc-body"><div class="pc-name"></div><div class="pc-meta"></div></div>`;
      entry = {el: div, imgSrc: curSrc};
      saleCardCache[p.id] = entry;
    }
    entry.el.onclick = ()=>saleStep2(p.id);
    entry.el.querySelector('.pc-name').textContent = p.name;
    entry.el.querySelector('.pc-meta').textContent = `Còn ${units.length} máy · ${fmt(productMinPrice(p.id))} đ`;
    frag.appendChild(entry.el);
  });
  el.innerHTML = '';
  el.appendChild(frag);
}

/* ================= ĐƠN HÀNG ================= */
let donHangFilter = 'all';
function saleProfit(s){
  const items = SALE_ITEMS.filter(i=>i.sale_id===s.id);
  const total = items.reduce((a,i)=>a+Number(i.sale_price),0);
  const cost = items.reduce((a,i)=>{ const u=UNITS.find(x=>x.id===i.unit_id); return a+(u?Number(u.cost_price):0); },0);
  const shopExtra = items.reduce((a,i)=>a+(i.extra_cost_payer==='shop'?Number(i.extra_cost):0),0);
  return total - cost - shopExtra;
}

function computeWarrantyText(uid){
  const btSel = document.querySelector(`.wp-baotest-sel[data-unit="${uid}"]`);
  const btCustom = document.querySelector(`.wp-baotest-custom[data-unit="${uid}"]`);
  const wSel = document.querySelector(`.wp-warranty-sel[data-unit="${uid}"]`);
  const wCustom = document.querySelector(`.wp-warranty-custom[data-unit="${uid}"]`);
  const baotest = btSel ? (btSel.value==='__custom__' ? btCustom.value.trim() : btSel.value) : '';
  const warranty = wSel ? (wSel.value==='__custom__' ? wCustom.value.trim() : wSel.value) : '';
  const parts = [];
  if(baotest) parts.push('Bao test '+baotest+' lỗi 1-1');
  if(warranty) parts.push('Bảo hành '+warranty);
  return parts.join(' · ');
}

async function saveCartSale(){
  if(!cart.length){ alert('Giỏ hàng đang trống'); return; }
  const phone = document.getElementById('csPhone').value.trim();
  const name = document.getElementById('csName').value.trim();
  const source = document.getElementById('csSource').value.trim();
  const seller = document.getElementById('csSeller').value.trim();
  const extra = unfmt(document.getElementById('csExtra').value);
  const extraPayer = document.getElementById('csExtraPayer').value;
  let qrUrl = null; if(qrPicker.file) qrUrl = await uploadImage(qrPicker.file);

  let customerId = null;
  if(phone || name){
    let existing = CUSTOMERS.find(c=>c.phone===phone && phone);
    if(existing){ customerId = existing.id; }
    else{
      const {data,error} = await sb.from('customers').insert({name:name||'Khách lẻ', phone}).select().single();
      if(!error) customerId = data.id;
    }
  }
  const {data:sale, error:e1} = await sb.from('sales').insert({customer_id:customerId, seller, qr_image:qrUrl, customer_source:source, status:'completed', sale_date: nowISO()}).select().single();
  if(e1){ alert('Lỗi: '+e1.message); return; }

  const itemRows = cart.map((uid,idx)=>{
    const priceEl = document.querySelector(`.cart-price[data-unit="${uid}"]`);
    const price = unfmt(priceEl?priceEl.value:'0');
    const warranty = computeWarrantyText(uid);
    return { sale_id:sale.id, unit_id:uid, sale_price:price, extra_cost: idx===0?extra:0, extra_cost_payer:extraPayer, warranty };
  });
  const {error:e2} = await sb.from('sale_items').insert(itemRows);
  if(e2){ alert('Lỗi lưu sản phẩm: '+e2.message); return; }
  for(const uid of cart){ await sb.from('product_units').update({status:'sold'}).eq('id', uid); }
  cart = [];
  await loadAll();
  render();
  showInvoice(sale.id);
}

function parseWarrantyText(text){
  text = text || '';
  const btMatch = text.match(/Bao test\s*([^·]+?)(?:\s*lỗi[^·]*)?(?:·|$)/i);
  const wMatch = text.match(/Bảo hành\s*([^·]+?)(?:·|$)/i);
  return [btMatch?btMatch[1].trim():'', wMatch?wMatch[1].trim():''];
}
async function saveEditSale(saleId, itemId){
  const phone = document.getElementById('esPhone').value.trim();
  const name = document.getElementById('esName').value.trim();
  const source = document.getElementById('esSource').value.trim();
  const price = unfmt(document.getElementById('esPrice').value);
  const extra = unfmt(document.getElementById('esExtra').value);
  const extraPayer = document.getElementById('esExtraPayer').value;
  const seller = document.getElementById('esSeller').value.trim();
  const warranty = computeWarrantyText(itemId);
  let qrUrl = qrPicker.existingUrl;
  if(qrPicker.file) qrUrl = await uploadImage(qrPicker.file);

  const s = SALES.find(x=>x.id===saleId);
  let customerId = s.customer_id;
  if(phone || name){
    let existing = CUSTOMERS.find(c=>c.phone===phone && phone);
    if(existing){ customerId = existing.id; await sb.from('customers').update({name:name||existing.name}).eq('id',existing.id); }
    else if(customerId){ await sb.from('customers').update({name:name||'Khách lẻ', phone}).eq('id', customerId); }
    else{ const {data} = await sb.from('customers').insert({name:name||'Khách lẻ', phone}).select().single(); customerId=data.id; }
  }
  await sb.from('sales').update({seller, qr_image:qrUrl, customer_id:customerId, customer_source:source}).eq('id', saleId);
  await sb.from('sale_items').update({sale_price:price, extra_cost:extra, extra_cost_payer:extraPayer, warranty}).eq('id', itemId);
  await loadAll(); openSaleDetail(saleId);
}
async function cancelSale(saleId){
  if(!confirm('Huỷ đơn này? Máy sẽ được bật lại tồn kho.')) return;
  const items = SALE_ITEMS.filter(i=>i.sale_id===saleId);
  for(const i of items){ await sb.from('product_units').update({status:'in_stock'}).eq('id', i.unit_id); }
  await sb.from('sales').update({status:'cancelled'}).eq('id', saleId);
  closeModal(); await loadAll(); render();
}

async function waitImagesLoaded(el){
  const imgs = [...el.querySelectorAll('img')];
  await Promise.all(imgs.map(img=>{
    if(img.complete && img.naturalWidth>0) return Promise.resolve();
    return new Promise(res=>{ img.onload=res; img.onerror=res; setTimeout(res,3000); });
  }));
}
async function saveReceiptImage(prefix){
  const el = document.getElementById('invoicePrint');
  try{
    await waitImagesLoaded(el);
    const canvas = await html2canvas(el, {backgroundColor:'#ffffff', scale:2, useCORS:true, allowTaint:true});
    const link = document.createElement('a');
    link.download = prefix + '_' + Date.now() + '.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  }catch(err){ alert('Lỗi lưu ảnh: '+err.message); }
}
async function copyReceiptImage(){
  const el = document.getElementById('invoicePrint');
  try{
    const blobPromise = (async ()=>{
      await waitImagesLoaded(el);
      const canvas = await html2canvas(el, {backgroundColor:'#ffffff', scale:2, useCORS:true, allowTaint:true});
      return await new Promise(res=>canvas.toBlob(res, 'image/png'));
    })();
    await navigator.clipboard.write([new ClipboardItem({'image/png': blobPromise})]);
    alert('Đã sao chép ảnh! Giờ mở Zalo/Messenger, bấm vào khung chat và dán (Ctrl+V hoặc giữ-dán) để gửi khách.');
  }catch(err){
    alert('Trình duyệt/thiết bị này chưa hỗ trợ sao chép ảnh trực tiếp. Dùng nút "Lưu ảnh" rồi gửi file ảnh đó qua Zalo nhé.');
  }
}

function renderCustBody(q){
  q=(q||'').toLowerCase();
  const isAdmin = PROFILE?.role==='admin';
  const mine = mySellerName();
  let list = CUSTOMERS.filter(c=>!q || c.name.toLowerCase().includes(q) || (c.phone||'').includes(q));

  document.getElementById('custBody').innerHTML = list.map(c=>{
    const mySales = SALES.filter(s=>s.customer_id===c.id && s.status==='completed' && (isAdmin || s.seller===mine));

function renderNo(m){
  const owedToMeAll = DEBTS.filter(d=>d.type==='ho_no_toi').map(d=>({...d, remain:debtRemaining(d)}));
  const iOweAll = DEBTS.filter(d=>d.type==='toi_no_ho').map(d=>({...d, remain:debtRemaining(d)}));
  const owedToMe = owedToMeAll.filter(d=>d.remain>0).sort((a,b)=>b.remain-a.remain);
  const iOwe = iOweAll.filter(d=>d.remain>0).sort((a,b)=>b.remain-a.remain);
  const paidOff = [...owedToMeAll, ...iOweAll].filter(d=>d.remain<=0).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
  const due = dueSoonDebts();
  m.innerHTML = `
    <div class="pagehead"><h1>Công nợ</h1><button class="btn" onclick="openNewDebt()">+ Thêm công nợ</button></div>
    ${due.length?`<div class="card" style="background:var(--amber-soft);border-color:var(--amber);margin-bottom:16px;">
      <div style="font-weight:700;color:#A9711A;margin-bottom:6px;">⏰ ${due.length} khoản nợ đã đến/quá hạn trả</div>
      ${due.map(d=>`<div style="font-size:13px;margin-top:4px;">${d.person_name} — còn <b>${fmt(debtRemaining(d))} đ</b> · hẹn ${dOnly(d.due_date+'T00:00:00')} <button class="btn small secondary" onclick="openDebtDetail('${d.id}')" style="margin-left:6px;">Xem</button></div>`).join('')}
    </div>`:''}
    <div class="grid cols-2">
      <div><h3 style="color:var(--green);">🟢 Người khác nợ tôi</h3>${debtTable(owedToMe,'green')}</div>
      <div><h3 style="color:var(--red);">🔴 Tôi nợ người khác</h3>${debtTable(iOwe,'red')}</div>
    </div>
    <h3 style="margin-top:24px;">📜 Lịch sử công nợ đã tất toán</h3>
    ${paidOff.length? `<table><thead><tr><th>Người</th><th>Loại</th><th>Tổng tiền</th><th></th></tr></thead><tbody>
      ${paidOff.map(d=>`<tr><td>${d.person_name}<div class="hint">${d.note||''}</div></td><td>${d.type==='ho_no_toi'?'Họ nợ tôi':'Tôi nợ họ'}</td><td>${fmt(d.total_amount)}</td><td><button class="btn small secondary" onclick="openDebtDetail('${d.id}')">Chi tiết</button></td></tr>`).join('')}
    </tbody></table>` : '<div class="empty">Chưa có khoản nào tất toán xong</div>'}
  `;
}
function debtTable(list,color){
  if(!list.length) return '<div class="empty">Không có</div>';
  const today = new Date(); today.setHours(0,0,0,0);
  return `<table><thead><tr><th>Người</th><th>Còn lại</th><th>Dự kiến trả</th><th></th></tr></thead><tbody>
    ${list.map(d=>{
      const isDue = d.due_date && new Date(d.due_date+'T00:00:00')<=today;
      return `<tr><td>${d.person_name}<div class="hint">${d.note||''}</div></td><td style="color:var(--${color});font-weight:700;">${fmt(d.remain)}</td><td>${d.due_date?dOnly(d.due_date+'T00:00:00'):'—'} ${isDue?'<span class="tag warn">Đến hạn</span>':''}</td><td><button class="btn small secondary" onclick="openDebtDetail('${d.id}')">Chi tiết</button></td></tr>`;
    }).join('')}
  </tbody></table>`;
}

  const el = document.getElementById('dpAmount'); if(el) el.oninput=e=>{e.target.value=fmt(unfmt(e.target.value));};

function setPayMode(mode, debtId){
  window._payMode = mode;
  document.getElementById('payModeFullBtn').classList.toggle('active', mode==='full');
  document.getElementById('payModePartBtn').classList.toggle('active', mode==='part');
  const wrap = document.getElementById('payAmountWrap');
  wrap.style.display = mode==='part' ? 'block' : 'none';
  if(mode==='part'){ document.getElementById('dpAmount').value=''; document.getElementById('dpAmount').focus(); }
}
async function addPayment(debtId){
  const d = DEBTS.find(x=>x.id===debtId);
  const remain = debtRemaining(d);
  let amount;
  if(window._payMode==='full'){
    amount = remain;
  }else{
    amount = unfmt((document.getElementById('dpAmount')||{}).value||'');
    if(!amount){ alert('Nhập số tiền khách trả'); return; }
    if(amount > remain){ alert('Số tiền trả không được lớn hơn số còn lại ('+fmt(remain)+' đ)'); return; }
  }
  const {error} = await sb.from('debt_payments').insert({debt_id:debtId, amount});
  if(error){ alert('Lỗi khi lưu tiền trả: '+error.message); return; }
  await loadAll(); openDebtDetail(debtId);
}

/* ================= BÁO CÁO ================= */
let baoCaoRange = 'thang';
function rangeStart(){
  const now = new Date();
  if(baoCaoRange==='ngay') return new Date(now.getFullYear(),now.getMonth(),now.getDate());
  if(baoCaoRange==='tuan'){ const d=new Date(now); const day=d.getDay()||7; d.setDate(d.getDate()-day+1); d.setHours(0,0,0,0); return d; }
  if(baoCaoRange==='thang') return new Date(now.getFullYear(),now.getMonth(),1);
  if(baoCaoRange==='quy'){ const q=Math.floor(now.getMonth()/3); return new Date(now.getFullYear(), q*3, 1); }
  if(baoCaoRange==='nam') return new Date(now.getFullYear(),0,1);
  return new Date(0);
}
function renderBaoCao(m){
  m.innerHTML = `
    <div class="pagehead"><h1>Báo cáo</h1><button class="btn secondary" onclick="exportExcel()">📥 Xuất Excel</button></div>
    <div class="tabbar">
      ${[['ngay','Hôm nay'],['tuan','Tuần này'],['thang','Tháng này'],['quy','Quý này'],['nam','Năm nay'],['all','Tất cả']].map(([k,l])=>`<button class="${baoCaoRange===k?'active':''}" onclick="baoCaoRange='${k}';renderBaoCao(document.getElementById('pageBody'))">${l}</button>`).join('')}
    </div>
    <div id="bcStats"></div>
    <h3 style="margin-top:24px;">👤 Doanh số theo nhân viên</h3>
    <div id="bcBySeller"></div>
  `;
  const start = baoCaoRange==='all' ? new Date(0) : rangeStart();
  const salesInRange = SALES.filter(s=>s.status==='completed' && new Date(s.sale_date)>=start);
  const itemsInRange = SALE_ITEMS.filter(i=>salesInRange.some(s=>s.id===i.sale_id));
  const revenue = itemsInRange.reduce((a,i)=>a+Number(i.sale_price),0);
  const cost = itemsInRange.reduce((a,i)=>{ const u=UNITS.find(x=>x.id===i.unit_id); return a+(u?Number(u.cost_price):0); },0);
  const shopExtraCost = itemsInRange.reduce((a,i)=> a + (i.extra_cost_payer==='shop'? Number(i.extra_cost):0), 0);
  const expensesInRange = EXPENSES.filter(e=>new Date(e.expense_date)>=start).reduce((a,e)=>a+Number(e.amount),0);
  const profit = revenue - cost - shopExtraCost - expensesInRange;
  const inStockCount = visibleInStockUnits().length;
  const inStockValue = visibleInStockUnits().reduce((a,u)=>a+Number(u.cost_price),0);

  document.getElementById('bcStats').innerHTML = `
    <div class="stat hero clickable" onclick="switchTab('donhang')" style="margin-bottom:14px;">
      <div class="lbl">DOANH THU</div>
      <div class="val">${fmt(revenue)} đ</div>
    </div>
    <div class="grid cols-2" style="margin-bottom:14px;">
      <div class="stat clickable" onclick="switchTab('donhang')"><div class="lbl">${profit>=0?'Lãi':'Lỗ'}</div><div class="val" style="color:${profit>=0?'var(--green)':'var(--red)'}">${fmt(Math.abs(profit))} đ</div></div>
      <div class="stat clickable" onclick="switchTab('chi')"><div class="lbl">Chi phí</div><div class="val" style="color:var(--red)">${fmt(expensesInRange)} đ</div></div>
    </div>
    <div class="grid cols-2">
      <div class="stat clickable" onclick="switchTab('donhang')"><div class="lbl">Số máy đã bán</div><div class="val">${itemsInRange.length} máy</div></div>
      <div class="stat clickable" onclick="switchTab('kho')"><div class="lbl">Tồn kho hiện tại</div><div class="val">${inStockCount} máy · ${fmt(inStockValue)} đ</div></div>
    </div>
  `;

  const bySeller = {};
  salesInRange.forEach(s=>{
    const key = s.seller || 'Không rõ';
    const items = SALE_ITEMS.filter(i=>i.sale_id===s.id);
    if(!bySeller[key]) bySeller[key] = {orders:0, revenue:0, profit:0};
    bySeller[key].orders += 1;
    items.forEach(i=>{
      const u = UNITS.find(x=>x.id===i.unit_id);
      const c = u?Number(u.cost_price):0;
      const extra = i.extra_cost_payer==='shop'?Number(i.extra_cost):0;
      bySeller[key].revenue += Number(i.sale_price);
      bySeller[key].profit += Number(i.sale_price) - c - extra;
    });
  });
  const sellerRows = Object.entries(bySeller).sort((a,b)=>b[1].revenue-a[1].revenue);
  document.getElementById('bcBySeller').innerHTML = sellerRows.length? `
    <table><thead><tr><th>Người bán</th><th>Số đơn</th><th>Doanh thu</th><th>Lãi/Lỗ</th></tr></thead>
    <tbody>${sellerRows.map(([name,v])=>`<tr><td>${name}</td><td>${v.orders}</td><td>${fmt(v.revenue)}</td><td style="color:${v.profit>=0?'var(--green)':'var(--red)'}">${fmt(v.profit)}</td></tr>`).join('')}</tbody></table>
  ` : '<div class="empty">Chưa có dữ liệu trong khoảng này</div>';
}
function exportExcel(){
  const wb = XLSX.utils.book_new();

  const sanPhamRows = UNITS.filter(u=>!u.hidden).map(u=>{
    const p = PRODUCTS.find(x=>x.id===u.product_id);
    return {
      'Sản phẩm': p?p.name:'', 'IMEI': u.imei||'', 'Màu': u.color||'', 'Cấu hình': u.config||'',
      'Giá nhập': Number(u.cost_price)||0, 'Giá bán sỉ': Number(u.wholesale_price)||0, 'Giá bán lẻ': Number(u.retail_price)||0,
      'Trạng thái': statusLabel(u.status), 'Ngày nhập': dOnly(u.imported_at), 'Nhập của ai': u.supplier||'', 'Ghi chú': u.note||''
    };
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(sanPhamRows), 'Kho hang');

  const banHangRows = [];
  SALES.forEach(s=>{
    const cust = CUSTOMERS.find(c=>c.id===s.customer_id);
    SALE_ITEMS.filter(i=>i.sale_id===s.id).forEach(i=>{
      const u = UNITS.find(x=>x.id===i.unit_id);
      const p = u?PRODUCTS.find(pp=>pp.id===u.product_id):null;
      banHangRows.push({
        'Ngày': dTime(s.sale_date), 'Sản phẩm': p?p.name:'', 'IMEI': u?u.imei:'', 'Khách': cust?cust.name:'',
        'SĐT khách': cust?cust.phone:'', 'Giá bán': Number(i.sale_price)||0, 'Chi phí PS': Number(i.extra_cost)||0,
        'Người bán': s.seller||'', 'Nguồn khách': s.customer_source||'', 'Trạng thái': s.status==='completed'?'Hoàn tất':'Đã huỷ'
      });
    });
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(banHangRows), 'Ban hang');

  const khRows = CUSTOMERS.map(c=>({'Tên':c.name, 'SĐT':c.phone||'', 'Số máy đã mua': SALES.filter(s=>s.customer_id===c.id && s.status==='completed').reduce((a,s)=>a+SALE_ITEMS.filter(i=>i.sale_id===s.id).length,0)}));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(khRows), 'Khach hang');

  const debtRows = DEBTS.map(d=>({'Người':d.person_name, 'Loại':d.type==='ho_no_toi'?'Họ nợ tôi':'Tôi nợ họ', 'Tổng tiền':Number(d.total_amount)||0, 'Còn lại':debtRemaining(d), 'Dự kiến trả':d.due_date||'', 'Ghi chú':d.note||''}));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(debtRows), 'Cong no');

  const expRows = EXPENSES.map(e=>({'Ngày':dOnly(e.expense_date), 'Mục':e.category, 'Số tiền':Number(e.amount)||0, 'Ghi chú':e.note||''}));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(expRows), 'Chi phi');

  const colRows = COLLECTIONS.map(c=>({'Ngày':dTime(c.created_at), 'Khách':c.customer_name||'', 'Số tiền':Number(c.amount)||0, 'Nội dung':c.note||''}));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(colRows), 'Thu tien');

  XLSX.writeFile(wb, 'thatthaphone_baocao_'+Date.now()+'.xlsx');
}

function renderNhanVien(m){
  m.innerHTML = `
    <div class="pagehead"><h1>Nhân viên & phân quyền</h1></div>
    <div class="hint" style="margin-bottom:14px;">Để thêm nhân viên mới: vào Supabase → Authentication → Add user (tick Auto Confirm User). Tài khoản mới sẽ tự hiện ở đây để bạn chỉnh quyền.</div>
    <table><thead><tr><th>Tên</th><th>Vai trò</th><th>Bán hàng</th><th>Kho</th><th>Khách hàng</th><th>Công nợ</th><th>Chi phí</th><th>Báo cáo</th></tr></thead>
    <tbody>${PROFILES.map(p=>{
      const perm = p.permissions||{};
      const chk = (key)=> `<input type="checkbox" ${perm[key]!==false?'checked':''} onchange="togglePerm('${p.id}','${key}',this.checked)" ${p.role==='admin'?'disabled':''}>`;
      return `<tr><td>${p.full_name||'—'}</td><td>${p.role==='admin'?'Admin':'Nhân viên'}</td>
      <td>${chk('ban_hang')}</td><td>${chk('kho')}</td><td>${chk('khach_hang')}</td><td>${chk('cong_no')}</td><td>${chk('chi_phi')}</td><td>${chk('bao_cao')}</td></tr>`;
    }).join('')}</tbody></table>
  `;
}
async function togglePerm(profileId, key, val){
  const p = PROFILES.find(x=>x.id===profileId);
  const perm = {...(p.permissions||{}), [key]: val};
  await sb.from('profiles').update({permissions:perm}).eq('id', profileId);
  await loadAll(); render();
}
